name: Tourism Project Pipeline

on:
  push:
    branches:
      - main  # Automatically triggers on push to the main branch
  workflow_dispatch:  # lets you click "Run workflow" in the Actions tab

permissions:
  contents: write   # allows the workflow to commit the trained model back to main

concurrency:        # if several pushes arrive together, only the newest run continues
  group: tourism-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:

  register-dataset:
    name: Register Dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Register Dataset
        run: python tourism_project/model_building/data_register.py
      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv
          retention-days: 7

  data-prep:
    name: Data Preparation
    needs: register-dataset          # starts only after the dataset is registered
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Run Data Preparation
        run: python tourism_project/model_building/prep.py
      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv
          retention-days: 7

  model-training:
    name: Model Training, Validation and Registration
    needs: data-prep                 # starts only after the splits exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0             # full history so the model commit can be rebased safely
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits          # brings Xtrain/Xtest/ytrain/ytest from the data-prep job
      - name: Start MLflow Server
        run: |
          nohup mlflow ui --host 0.0.0.0 --port 5000 > mlflow.log 2>&1 &   # Run MLflow UI in the background
          for i in $(seq 1 30); do curl -s http://localhost:5000 > /dev/null && break; sleep 2; done   # wait until it answers
      - name: Model Building
        run: python tourism_project/model_building/train.py
      - name: Validate Model (quality gate)
        run: python tourism_project/model_building/validate_model.py
      - name: Upload MLflow Tracking Data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-tracking
          path: |
            mlruns
            mlartifacts
          retention-days: 7
      - name: Commit Trained Model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tourism_project/deployment/best_tourism_model_v1.joblib tourism_project/deployment/model_metadata.json   # path to the saved model file
          git commit -m "Add trained model [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin HEAD:main
